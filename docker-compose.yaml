services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${APP_DB_NAME:-clean_arch}
      MYSQL_USER: ${APP_DB_USER:-app}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: admin
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.22}
    command: ["migrate", "up"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_HTTP_ADDRESS: ":8080"
      APP_DB_HOST: mysql
      APP_DB_PORT: "3306"
      APP_DB_USER: ${APP_DB_USER:-app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME:-clean_arch}
      APP_JWT_KEY: ${APP_JWT_KEY:?set APP_JWT_KEY}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

  app:
    build:
      context: .
      target: server
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.22}
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_HTTP_ADDRESS: ":8080"
      APP_DB_HOST: mysql
      APP_DB_PORT: "3306"
      APP_DB_USER: ${APP_DB_USER:-app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME:-clean_arch}
      APP_JWT_KEY: ${APP_JWT_KEY:?set APP_JWT_KEY}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-clean-arch-gin}
      APP_JWT_AUDIENCE: ${APP_JWT_AUDIENCE:-clean-arch-api}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GIN_MODE: release
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
